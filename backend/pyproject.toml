[project]
name = "marketing-agent-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi[standard]>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "httpx>=0.27",
  # 문서 업로드(app/doctext.py) — mi-report(~/gitspace/mi-report)는 PDF에
  # PyMuPDF(AGPL-3.0, 상용 라이선스 별매)를 쓴다. 이 저장소는 외부 배포
  # 가능성을 열어 두기 위해 허용적 라이선스(BSD/MIT)만 쓴다: pypdf, python-docx,
  # python-pptx.
  "pypdf>=4.0",
  "python-docx>=1.1",
  "python-pptx>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]
# app/embeddings.py의 의미 검색 백엔드. opt-in인 이유: fastembed는 첫 사용 시
# ONNX 모델(~100MB)을 내려받는다 — 기본 설치·기본 Docker 이미지는 이 비용을
# 물지 않는다. 설치 후 MA_EMBEDDINGS=1로 켠다. BM25(SQLite 내장 FTS5)는
# 이 extras 없이 항상 동작한다.
embeddings = ["fastembed>=0.3"]

[tool.setuptools]
# data/(런타임 SQLite)와 profiles/(hermes SOUL.md) 디렉터리가 backend/ 아래
# 생기면서 setuptools 자동탐지가 "top-level package가 여럿"이라며 거부하기
# 시작했다 — 패키지는 app 하나뿐임을 명시한다.
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
